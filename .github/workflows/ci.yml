name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # 타입 검사는 next build에도 포함되지만, 실패 원인을 빨리 구분하려고 먼저 실행한다
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      # Notion 시크릿 없이도 빌드되도록 설계했다 (generateStaticParams가 조회 실패 시 빈 목록을 반환).
      # 실제 데이터 검증은 Vercel 배포와 스모크 테스트에서 한다
      - name: Build
        run: npm run build
